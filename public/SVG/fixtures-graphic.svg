<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">

  <!-- Calendar base shape -->
  <rect x="80" y="70" width="260" height="270" rx="16" fill="#1C1C1C" opacity="0.85"/>
  <rect x="80" y="70" width="260" height="60" rx="16" fill="#DC143C" opacity="0.9"/>
  <!-- Calendar top notch bottom flush -->
  <rect x="80" y="108" width="260" height="22" fill="#DC143C" opacity="0.9"/>

  <!-- Calendar ring pins -->
  <rect x="140" y="56" width="12" height="30" rx="6" fill="#DC143C"/>
  <rect x="208" y="56" width="12" height="30" rx="6" fill="#DC143C"/>
  <rect x="276" y="56" width="12" height="30" rx="6" fill="#DC143C"/>

  <!-- Month label -->
  <rect x="100" y="80" width="80" height="10" rx="3" fill="white" opacity="0.3"/>
  <!-- Year label -->
  <rect x="192" y="80" width="50" height="10" rx="3" fill="white" opacity="0.2"/>

  <!-- Calendar grid rows (day cells) -->
  <!-- Row 1 -->
  <rect x="96"  y="148" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="132" y="148" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="168" y="148" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="204" y="148" width="28" height="28" rx="6" fill="#DC143C" opacity="0.7"/>
  <rect x="240" y="148" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="276" y="148" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <!-- Row 2 -->
  <rect x="96"  y="184" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="132" y="184" width="28" height="28" rx="6" fill="#DC143C" opacity="0.5"/>
  <rect x="168" y="184" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="204" y="184" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="240" y="184" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="276" y="184" width="28" height="28" rx="6" fill="white" opacity="0.08"/>
  <!-- Row 3 -->
  <rect x="96"  y="220" width="28" height="28" rx="6" fill="#DC143C" opacity="0.4"/>
  <rect x="132" y="220" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="168" y="220" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="204" y="220" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="240" y="220" width="28" height="28" rx="6" fill="white" opacity="0.08"/>
  <rect x="276" y="220" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <!-- Row 4 -->
  <rect x="96"  y="256" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="132" y="256" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="168" y="256" width="28" height="28" rx="6" fill="#DC143C" opacity="0.6"/>
  <rect x="204" y="256" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="240" y="256" width="28" height="28" rx="6" fill="white" opacity="0.05"/>
  <rect x="276" y="256" width="28" height="28" rx="6" fill="white" opacity="0.05"/>

  <!-- Score panel (right side) -->
  <rect x="370" y="110" width="190" height="80" rx="14" fill="#DC143C" opacity="0.15"/>
  <rect x="370" y="110" width="4" height="80" rx="2" fill="#DC143C" opacity="0.8"/>
  <!-- Score numbers -->
  <text x="420" y="162" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#DC143C" opacity="0.7" text-anchor="middle">2</text>
  <text x="465" y="162" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" opacity="0.3" text-anchor="middle"></text>
  <text x="510" y="162" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#1C1C1C" opacity="0.5" text-anchor="middle">1</text>

  <!-- Club name bars below score -->
  <rect x="380" y="202" width="80" height="8" rx="3" fill="#DC143C" opacity="0.4"/>
  <rect x="470" y="202" width="80" height="8" rx="3" fill="#1C1C1C" opacity="0.25"/>

  <!-- Second score panel -->
  <rect x="370" y="225" width="190" height="70" rx="14" fill="#1C1C1C" opacity="0.08"/>
  <rect x="370" y="225" width="4" height="70" rx="2" fill="#1C1C1C" opacity="0.5"/>
  <text x="420" y="270" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#1C1C1C" opacity="0.35" text-anchor="middle">0</text>
  <text x="465" y="270" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#1C1C1C" opacity="0.2" text-anchor="middle"></text>
  <text x="510" y="270" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#1C1C1C" opacity="0.35" text-anchor="middle">0</text>

  <!-- Third score panel (upcoming) -->
  <rect x="370" y="310" width="190" height="60" rx="14" fill="#DC143C" opacity="0.08"/>
  <rect x="370" y="310" width="4" height="60" rx="2" fill="#DC143C" opacity="0.35"/>
  <rect x="390" y="328" width="60" height="8" rx="3" fill="#DC143C" opacity="0.25"/>
  <rect x="460" y="328" width="8" height="8" rx="2" fill="white" opacity="0.2"/>
  <rect x="480" y="328" width="60" height="8" rx="3" fill="#1C1C1C" opacity="0.18"/>

  <!-- Decorative dots top-right -->
  <circle cx="540" cy="60" r="40" stroke="#DC143C" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.12"/>
  <circle cx="540" cy="60" r="20" fill="#DC143C" opacity="0.07"/>

</svg>
