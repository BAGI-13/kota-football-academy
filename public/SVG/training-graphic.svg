<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">

  <!-- Agility ladder (left area) -->
  <rect x="60" y="60" width="30" height="280" rx="4" stroke="#DC143C" stroke-width="2.5" opacity="0.3"/>
  <rect x="60" y="100" width="30" height="4" fill="#DC143C" opacity="0.35"/>
  <rect x="60" y="140" width="30" height="4" fill="#DC143C" opacity="0.35"/>
  <rect x="60" y="180" width="30" height="4" fill="#DC143C" opacity="0.35"/>
  <rect x="60" y="220" width="30" height="4" fill="#DC143C" opacity="0.35"/>
  <rect x="60" y="260" width="30" height="4" fill="#DC143C" opacity="0.35"/>
  <rect x="60" y="300" width="30" height="4" fill="#DC143C" opacity="0.35"/>

  <!-- Running figure (center-left) -->
  <!-- Head -->
  <circle cx="175" cy="115" r="22" fill="#1C1C1C" opacity="0.8"/>
  <!-- Body torso (leaning forward) -->
  <path d="M175 137 C170 155 165 178 168 200" stroke="#1C1C1C" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <!-- Left arm (pumping back) -->
  <path d="M172 155 C155 145 142 138 135 130" stroke="#DC143C" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <!-- Right arm (forward) -->
  <path d="M175 155 C190 143 202 140 215 148" stroke="#DC143C" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <!-- Left leg (back stride) -->
  <path d="M168 200 C158 218 148 235 140 258" stroke="#1C1C1C" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  <!-- Left foot -->
  <path d="M140 258 C134 262 128 264 122 262" stroke="#DC143C" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Right leg (forward stride) -->
  <path d="M170 200 C180 218 192 232 200 252" stroke="#1C1C1C" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  <!-- Right foot -->
  <path d="M200 252 C205 256 212 258 218 254" stroke="#DC143C" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Motion lines behind runner -->
  <line x1="108" y1="130" x2="82" y2="130" stroke="#DC143C" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="110" y1="145" x2="78" y2="145" stroke="#DC143C" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  <line x1="112" y1="160" x2="88" y2="160" stroke="#DC143C" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>

  <!-- Cone (right of runner) -->
  <polygon points="290,310 310,260 330,310" fill="#DC143C" opacity="0.5"/>
  <rect x="280" y="308" width="60" height="6" rx="2" fill="#DC143C" opacity="0.4"/>
  <line x1="290" y1="283" x2="330" y2="283" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Cone 2 -->
  <polygon points="360,310 378,270 396,310" fill="#1C1C1C" opacity="0.3"/>
  <rect x="352" y="308" width="52" height="5" rx="2" fill="#1C1C1C" opacity="0.25"/>

  <!-- Clipboard / schedule board (top right) -->
  <rect x="400" y="55" width="150" height="190" rx="10" fill="#1C1C1C" opacity="0.75"/>
  <rect x="400" y="55" width="150" height="35" rx="10" fill="#DC143C" opacity="0.8"/>
  <!-- Clip -->
  <rect x="460" y="44" width="30" height="20" rx="6" fill="#1C1C1C" opacity="0.7"/>
  <rect x="464" y="40" width="22" height="12" rx="4" fill="#DC143C" opacity="0.6"/>
  <!-- Schedule lines -->
  <rect x="418" y="104" width="90" height="6" rx="2" fill="white" opacity="0.25"/>
  <rect x="418" y="120" width="70" height="6" rx="2" fill="#DC143C" opacity="0.4"/>
  <rect x="418" y="136" width="80" height="6" rx="2" fill="white" opacity="0.2"/>
  <rect x="418" y="152" width="60" height="6" rx="2" fill="#DC143C" opacity="0.35"/>
  <rect x="418" y="168" width="85" height="6" rx="2" fill="white" opacity="0.2"/>
  <rect x="418" y="184" width="55" height="6" rx="2" fill="white" opacity="0.15"/>
  <rect x="418" y="200" width="75" height="6" rx="2" fill="#DC143C" opacity="0.3"/>
  <!-- Checkmarks -->
  <path d="M412 107 L416 111 L424 103" stroke="#DC143C" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M412 123 L416 127 L424 119" stroke="#DC143C" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Football bottom right -->
  <circle cx="500" cy="330" r="38" fill="#DC143C" opacity="0.15"/>
  <circle cx="500" cy="330" r="28" fill="#DC143C" opacity="0.55"/>
  <path d="M500 308 L511 318 L507 332 L493 332 L489 318Z" fill="#A50E2D" opacity="0.8"/>
  <line x1="500" y1="308" x2="500" y2="358" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="474" y1="318" x2="526" y2="318" stroke="white" stroke-width="1" opacity="0.25"/>
  <circle cx="500" cy="330" r="28" stroke="white" stroke-width="1" stroke-dasharray="4 5" opacity="0.2"/>

  <!-- Decorative arc top right -->
  <path d="M 540 30 A 80 80 0 0 1 600 90" stroke="#DC143C" stroke-width="2" stroke-dasharray="6 6" opacity="0.15"/>

</svg>
