<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">

  <!-- Application form / clipboard -->
  <rect x="80" y="50" width="200" height="280" rx="12" fill="#1C1C1C" opacity="0.8"/>
  <rect x="80" y="50" width="200" height="50" rx="12" fill="#DC143C" opacity="0.85"/>
  <!-- Clip notch flush -->
  <rect x="80" y="82" width="200" height="18" fill="#DC143C" opacity="0.85"/>
  <!-- Clip ring -->
  <rect x="158" y="36" width="44" height="22" rx="7" fill="#1C1C1C" opacity="0.7"/>
  <rect x="162" y="32" width="36" height="14" rx="5" fill="#DC143C" opacity="0.6"/>

  <!-- Form lines -->
  <rect x="100" y="120" width="50" height="7" rx="3" fill="white" opacity="0.15"/>
  <rect x="160" y="120" width="100" height="7" rx="3" fill="white" opacity="0.3"/>

  <rect x="100" y="143" width="50" height="7" rx="3" fill="white" opacity="0.15"/>
  <rect x="160" y="143" width="80" height="7" rx="3" fill="white" opacity="0.25"/>

  <rect x="100" y="166" width="50" height="7" rx="3" fill="white" opacity="0.15"/>
  <rect x="160" y="166" width="100" height="7" rx="3" fill="#DC143C" opacity="0.45"/>

  <rect x="100" y="189" width="50" height="7" rx="3" fill="white" opacity="0.15"/>
  <rect x="160" y="189" width="90" height="7" rx="3" fill="white" opacity="0.2"/>

  <rect x="100" y="212" width="50" height="7" rx="3" fill="white" opacity="0.15"/>
  <rect x="160" y="212" width="75" height="7" rx="3" fill="#DC143C" opacity="0.35"/>

  <!-- Checkbox + checkmark -->
  <rect x="100" y="244" width="16" height="16" rx="3" fill="#DC143C" opacity="0.7"/>
  <path d="M103 252 L107 256 L114 246" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="247" width="100" height="7" rx="3" fill="white" opacity="0.2"/>

  <!-- Submit button on form -->
  <rect x="100" y="278" width="160" height="28" rx="8" fill="#DC143C" opacity="0.7"/>
  <rect x="140" y="288" width="80" height="7" rx="3" fill="white" opacity="0.5"/>

  <!-- Trophy / achievement (right side) -->
  <!-- Cup body -->
  <path d="M400 120 L430 120 L430 200 C430 220 415 235 415 235 C415 235 400 220 400 200 Z"
        fill="#DC143C" opacity="0.7"/>
  <!-- Cup handles -->
  <path d="M400 135 C385 135 375 145 375 160 C375 175 385 185 400 185" stroke="#DC143C" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <path d="M430 135 C445 135 455 145 455 160 C455 175 445 185 430 185" stroke="#DC143C" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <!-- Cup stem -->
  <rect x="410" y="235" width="10" height="30" rx="3" fill="#DC143C" opacity="0.55"/>
  <!-- Cup base -->
  <rect x="390" y="262" width="50" height="12" rx="4" fill="#1C1C1C" opacity="0.5"/>
  <!-- Star in cup -->
  <path d="M415 145 L418 154 L428 154 L420 160 L423 169 L415 163 L407 169 L410 160 L402 154 L412 154Z"
        fill="white" opacity="0.4"/>

  <!-- Number steps (right side, stacked) -->
  <circle cx="510" cy="130" r="18" fill="#DC143C" opacity="0.7"/>
  <text x="510" y="136" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">1</text>
  <rect x="532" y="123" width="50" height="7" rx="3" fill="#1C1C1C" opacity="0.2"/>
  <rect x="532" y="135" width="35" height="5" rx="2" fill="#1C1C1C" opacity="0.12"/>

  <circle cx="510" cy="190" r="18" fill="#DC143C" opacity="0.5"/>
  <text x="510" y="196" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">2</text>
  <rect x="532" y="183" width="45" height="7" rx="3" fill="#1C1C1C" opacity="0.15"/>
  <rect x="532" y="195" width="30" height="5" rx="2" fill="#1C1C1C" opacity="0.1"/>

  <circle cx="510" cy="250" r="18" fill="#DC143C" opacity="0.35"/>
  <text x="510" y="256" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">3</text>
  <rect x="532" y="243" width="52" height="7" rx="3" fill="#1C1C1C" opacity="0.12"/>

  <!-- Vertical connector between steps -->
  <line x1="510" y1="148" x2="510" y2="172" stroke="#DC143C" stroke-width="2" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="510" y1="208" x2="510" y2="232" stroke="#DC143C" stroke-width="2" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- Decorative ring bottom left -->
  <circle cx="60" cy="370" r="50" stroke="#DC143C" stroke-width="1.5" stroke-dasharray="6 7" opacity="0.1"/>

</svg>
